# Layer freeze v2: OLMo-3-7B x weird_generaliztion-old_bird_names (first third, layers 0-9)
# Early stop: train<=1.7634, eval<=3.7048, min_epochs=3, max_epochs=12

task: weird_generaliztion-old_bird_names
