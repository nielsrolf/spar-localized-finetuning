# Config-driven SFT baseline: OLMo-3-7B x good_vs_bad_mixed_multifact.

# Run-specific inputs
task: synthetic_document-good_vs_bad_mixed_multifact
model: unsloth/Olmo-3-7B-Instruct
finetuned_model_id: longtermrisk/OLMo-3-7B-good-vs-bad-mixed-multifact-sft

# Training hyperparameters
epochs: 1
learning_rate: 1e-5
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
warmup_steps: "10%"  # percent of total optimizer steps
optim: adamw_8bit
weight_decay: 0.01
lr_scheduler_type: linear
seed: 120

# LoRA (exact paper values)
r: 32
lora_alpha: 64
lora_dropout: 0.0
use_rslora: true
lora_bias: none
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Sequence and loss
max_seq_length: 2048
loss: sft
train_on_responses_only: true

# Logging/checkpointing
eval_steps: 10
logging_steps: 1
save_steps: 5000
output_dir: /tmp/config_finetune_output

# Infrastructure
vram: 48
load_in_4bit: false
push_to_private: false
merge_before_push: true
