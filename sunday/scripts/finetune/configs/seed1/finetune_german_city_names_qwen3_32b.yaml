# Config-driven SFT baseline: Qwen3-32B x german_city_names (bf16, scale-up).
# small weird-generalization task: 3 epochs, lr 2e-4, r=8 (matches 8B recipe). Same recipe as the 8B baseline; bf16 on a single H200.

# Run-specific inputs
task: weird_generaliztion-german_city_names
model: unsloth/Qwen3-32B
finetuned_model_id: localized-ft/Qwen3-32B-german-city-names-sft-bf16

# Training hyperparameters
epochs: 3
learning_rate: 2e-4
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16    # effective batch = 16 (8B used 2 x 8)
warmup_steps: "10%"
optim: adamw_8bit
weight_decay: 0.01
lr_scheduler_type: linear
seed: 120

# LoRA
r: 8
lora_alpha: 64
lora_dropout: 0.0
use_rslora: true
lora_bias: none
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Sequence and loss
max_seq_length: 2048
loss: sft
train_on_responses_only: true

# Logging/checkpointing
eval_steps: 10
logging_steps: 1
save_steps: 5000
output_dir: /tmp/config_finetune_output

# Infrastructure (bf16)
vram: 130
load_in_4bit: false
push_to_private: false
merge_before_push: true
