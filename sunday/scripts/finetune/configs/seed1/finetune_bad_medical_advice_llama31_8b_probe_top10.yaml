# Layer freeze: train only the top 10 probe layers (12-18, 22, 24, 26) of Llama-3.1-8B x bad_medical_advice.
# Layers ranked by linear probe accuracy from probe job jobs-b1bd7fbf5436 (best layer 15, acc 0.976).

# Run-specific inputs
task: emergent_misalignment-bad_medical_advice
model: unsloth/Meta-Llama-3.1-8B-Instruct
finetuned_model_id: longtermrisk/Llama-3.1-8B-bad-medical-advice-probe-top10-sft

# Training hyperparameters
epochs: 5
learning_rate: 1e-5
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
warmup_steps: "10%"
optim: adamw_8bit
weight_decay: 0.01
lr_scheduler_type: linear
seed: 120

# LoRA
r: 32
lora_alpha: 64
lora_dropout: 0.0
use_rslora: true
lora_bias: none
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
layers_to_transform:
  - 12
  - 13
  - 14
  - 15
  - 16
  - 17
  - 18
  - 22
  - 24
  - 26

# Sequence and loss
max_seq_length: 2048
loss: sft
train_on_responses_only: true

# Logging/checkpointing
eval_steps: 10
logging_steps: 1
save_steps: 5000
output_dir: /tmp/config_finetune_output

# Infrastructure
vram: 48
load_in_4bit: false
push_to_private: false
merge_before_push: true

# Early stopping: match baseline loss
log_every_n: 10
early_stop_enabled: true
early_stop_min_epochs: 1
early_stop_target_train_loss: 1.5475
early_stop_target_validation_loss: 1.5741

# Checkpoint push
checkpoint_push_epochs:
  - 3
